<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Khatmah Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .setup-screen, .timer-screen {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .hidden {
            display: none !important;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.1em;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: rgba(255, 255, 255, 0.6);
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: rgba(255, 255, 255, 0.6);
        }

        select option {
            background: white;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            outline: none;
            font-family: 'Courier New', monospace;
        }

        input[type="text"]:focus {
            border-color: rgba(255, 255, 255, 0.6);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .time-input-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.1em;
        }

        .time-input-box {
            width: 50px;
            padding: 10px;
            font-size: 1.1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            outline: none;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .time-input-box:focus {
            border-color: rgba(255, 255, 255, 0.6);
        }

        .time-input-separator {
            color: white;
            font-weight: bold;
            font-size: 1.3em;
        }

        .time-input-error {
            color: #ff6b6b;
            font-size: 0.85em;
            margin-top: 5px;
            min-height: 20px;
        }

        .adjust-time-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 30px;
            font-size: 1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .adjust-time-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .overlay-content {
            background: rgba(30, 60, 114, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .overlay h2 {
            margin-bottom: 25px;
            text-align: center;
        }

        .adjust-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .adjust-buttons .btn-full {
            grid-column: 1 / -1;
        }

        .btn-add {
            background: #4CAF50;
            color: white;
        }

        .btn-add:hover {
            background: #45a049;
        }

        .timeline-section .btn-add {
            width: 100%;
            margin-top: 10px;
        }

        .btn-subtract {
            background: #f44336;
            color: white;
        }

        .btn-subtract:hover {
            background: #da190b;
        }

        .btn-skip {
            background: #2196F3;
            color: white;
        }

        .btn-skip:hover {
            background: #0b7dda;
        }

        .btn-cancel {
            background: #9E9E9E;
            color: white;
        }

        .btn-cancel:hover {
            background: #757575;
        }

        .timeline-section {
            margin-top: 30px;
        }

        .timeline-segment {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .segment-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .input-group input {
            padding: 10px;
            font-size: 1em;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        .btn-danger {
            background: #f44336;
            color: white;
            padding: 10px 20px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .button-group {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            gap: 15px;
        }

        /* Timer Screen Styles */
        .timer-screen {
            text-align: center;
            padding: 60px 40px;
        }

        .status-indicator {
            display: inline-block;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-reading {
            background: #4CAF50;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
        }

        .status-break {
            background: #FF9800;
            box-shadow: 0 0 30px rgba(255, 152, 0, 0.5);
        }

        .status-paused {
            background: #9E9E9E;
            box-shadow: 0 0 30px rgba(158, 158, 158, 0.5);
        }

        .main-display {
            margin: 40px 0;
        }

        .countdown-timer {
            font-size: 12em;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 6px 6px 12px rgba(0, 0, 0, 0.5);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }

        .page-counter {
            font-size: 6.5em;
            font-weight: 600;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .page-label {
            font-size: 2em;
            margin-top: 10px;
            opacity: 0.8;
        }

        .mini-clocks {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .mini-clock {
            text-align: center;
        }

        .mini-clock-time {
            font-size: 2.5em;
            font-weight: 600;
            color: #B0E0E6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-variant-numeric: tabular-nums;
        }

        .mini-clock-label {
            font-size: 1.2em;
            margin-top: 10px;
            opacity: 0.8;
            color: #E0E0E0;
        }

        .progress-bar-container {
            width: 80%;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            margin: 30px auto;
            overflow: visible;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            display: flex;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .progress-segment {
            height: 100%;
            position: relative;
        }

        .progress-segment.reading {
            background: #4CAF50;
        }

        .progress-segment.break {
            background: #FF9800;
        }

        .progress-completed-overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    45deg,
                    rgba(0, 0, 0, 0.5),
                    rgba(0, 0, 0, 0.5) 3px,
                    transparent 3px,
                    transparent 6px
                ),
                repeating-linear-gradient(
                    -45deg,
                    rgba(0, 0, 0, 0.5),
                    rgba(0, 0, 0, 0.5) 3px,
                    transparent 3px,
                    transparent 6px
                ),
                rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 5;
            transition: width 0.1s linear;
        }

        .progress-indicator {
            position: absolute;
            top: -4px;
            height: 20px;
            width: 3px;
            background: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
            transition: left 0.1s linear;
            z-index: 10;
            border-radius: 1.5px;
        }

        .timeline-progress {
            margin: 40px 0;
            font-size: 1.3em;
            opacity: 0.9;
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .control-buttons button {
            padding: 20px 50px;
            font-size: 1.3em;
        }

        .segment-label {
            font-weight: 600;
            color: #FFD700;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .countdown-timer {
                font-size: 5em;
            }
            .page-counter {
                font-size: 3em;
            }
            .segment-inputs {
                grid-template-columns: 1fr;
            }
            .mini-clocks {
                gap: 30px;
            }
        }

        @media (max-width: 480px) {
            .countdown-timer {
                font-size: 3.5em;
            }
        }
    
        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0 30px 0;
            flex-wrap: wrap;
        }

        .mode-toggle label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.18);
            cursor: pointer;
            user-select: none;
            margin-bottom: 0;
            font-size: 1.05em;
        }

        .mode-toggle input[type="radio"] {
            transform: scale(1.2);
            accent-color: #FFD700;
        }

        .finish-time-row {
            margin-top: 18px;
            padding: 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.18);
        }

        .finish-time-row .time-input-container {
            justify-content: flex-start;
        }

        .ampm-select {
            width: 90px;
            padding: 10px;
            font-size: 1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            margin-left: 10px;
        }

</style>
</head>
<body>
    <div class="container">
        <!-- Setup Screen -->
        <div id="setupScreen" class="setup-screen">
            <h1>📖 Quran Khatmah Clock</h1>

            <div class="mode-toggle" role="radiogroup" aria-label="Input mode">
                <label>
                    <input type="radio" name="inputMode" id="modeDuration" value="duration" checked
                           onchange="setInputMode('duration')">
                    Duration
                </label>
                <label>
                    <input type="radio" name="inputMode" id="modeClock" value="clock"
                           onchange="setInputMode('clock')">
                    Time (clock)
                </label>
            </div>

            
            <div class="form-group">
                <label for="totalPages">Total Pages:</label>
                <input type="number" id="totalPages" value="604" min="1">
            </div>

            <div class="timeline-section">
                <h2 style="margin-bottom: 20px;">Timeline Schedule</h2>
                <div id="timelineSegments">
                    <!-- Segments will be added here -->
                </div>
                
                <div id="finishTimeRow" class="finish-time-row hidden">
                    <label style="margin-bottom: 10px;">Finish Time (end of last segment):</label>
                    <div class="time-input-container">
                        <input type="text" class="time-input-box" id="finish-hours"
                               placeholder="HH" maxlength="2"
                               oninput="handleFinishTimeInput('hours', this.value)"
                               onfocus="this.select()"
                               onblur="validateFinishTime()">
                        <span class="time-input-separator">:</span>
                        <input type="text" class="time-input-box" id="finish-minutes"
                               placeholder="MM" maxlength="2"
                               oninput="handleFinishTimeInput('minutes', this.value)"
                               onfocus="this.select()"
                               onblur="validateFinishTime()">
                        <select class="ampm-select" id="finish-ampm" onchange="validateFinishTime()">
                            <option value="AM">AM</option>
                            <option value="PM" selected>PM</option>
                        </select>
                    </div>
                    <div class="time-input-error" id="finish-error"></div>
                </div>

                <button class="btn-add" onclick="addSegment()">+ Add Segment</button>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="startTimer()">Start Khatmah</button>
            </div>
        </div>

        <!-- Timer Screen -->
        <div id="timerScreen" class="timer-screen hidden">
            <div class="status-indicator" id="statusIndicator">Reading</div>
            <div id="clockWarning" style="margin-top:12px; font-size:1.05em; color:#FFD700; display:none;"></div>
            
            <div class="main-display">
                <div class="countdown-timer" id="countdownTimer">00:00</div>
                
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-completed-overlay" id="progressCompletedOverlay"></div>
                        <div class="progress-indicator" id="progressIndicator"></div>
                    </div>
                </div>
                
                <button class="adjust-time-btn" onclick="openAdjustTimeOverlay()">± Adjust Time</button>
                
                <div class="page-counter" id="pageCounter">1</div>
                <div class="page-label">Current Page</div>
            </div>

            <div class="mini-clocks">
                <div class="mini-clock">
                    <div class="mini-clock-time" id="readingTimeRemaining">00:00:00</div>
                    <div class="mini-clock-label">Total Reading Time Remaining</div>
                </div>
                <div class="mini-clock">
                    <div class="mini-clock-time" id="totalTimeRemaining">00:00:00</div>
                    <div class="mini-clock-label">Total Time Remaining</div>
                </div>
            </div>

            <div class="timeline-progress" id="timelineProgress">
                Segment 1 of 1
            </div>

            <div class="control-buttons">
                <button class="btn-secondary" id="pauseBtn" onclick="togglePause()">Pause</button>
                <button class="btn-danger" onclick="resetTimer()">Reset</button>
            </div>
        </div>
    </div>

    <!-- Adjust Time Overlay -->
    <div id="adjustTimeOverlay" class="overlay hidden">
        <div class="overlay-content">
            <h2>⏱️ Adjust Time</h2>
            
            <div class="form-group">
                <label>Time Amount:</label>
                <div class="time-input-container">
                    <input type="text" class="time-input-box" id="adjust-hours" 
                           placeholder="00" maxlength="2"
                           oninput="handleAdjustTimeInput('hours', this.value)"
                           onfocus="this.select()">
                    <span class="time-input-separator">:</span>
                    <input type="text" class="time-input-box" id="adjust-minutes" 
                           placeholder="00" maxlength="2"
                           oninput="handleAdjustTimeInput('minutes', this.value)"
                           onfocus="this.select()">
                    <span class="time-input-separator">:</span>
                    <input type="text" class="time-input-box" id="adjust-seconds" 
                           placeholder="00" maxlength="2"
                           oninput="handleAdjustTimeInput('seconds', this.value)"
                           onfocus="this.select()">
                </div>
                <div class="time-input-error" id="adjust-error"></div>
            </div>

            <div class="adjust-buttons">
                <button class="btn-add" onclick="adjustTime('add')">+ Add Time</button>
                <button class="btn-subtract" onclick="adjustTime('subtract')">− Subtract Time</button>
                <button class="btn-skip btn-full" onclick="skipToNextSegment()">⏭️ Skip to Next Segment</button>
                <button class="btn-cancel btn-full" onclick="closeAdjustTimeOverlay()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let timerState = {
            inputMode: 'duration',  // 'duration' | 'clock'
            finishTime: { hours: '', minutes: '', ampm: 'PM' },  // used in clock mode
            scheduleStartsAbsMs: null,   // [ms] segment start timestamps (clock mode)
            scheduleFinishAbsMs: null,   // ms finish timestamp (clock mode)
            scheduleOffsetMs: 0,         // ms added to shift schedule forward (pause/adjust)
            waitingToStart: false,       // clock mode: before first segment begins
            rateResetAbsMs: null,        // clock mode: effective start for page pacing
            pausedAtSystemMs: null,      // clock mode: system time when paused
            lastSystemNowMs: null,       // clock mode: for clock-jump detection

            totalPages: 604,
            originalTotalPages: 604,  // Store original user input
            timeline: [],
            currentSegmentIndex: 0,
            segmentTimeRemaining: 0,
            totalReadingTime: 0,
            currentPage: 1,
            isPaused: false,
            isRunning: false,
            lastTickTime: null,
            actualElapsedReadingTime: 0  // Track actual reading time independent of skips
        };

        let timerInterval = null;

        // Initialize with one segment
        function init() {
            loadState();
            // Sync input mode UI
            setInputMode(timerState.inputMode || 'duration');
            // Restore finish time inputs if present
            if (timerState.finishTime) {
                const fh = document.getElementById('finish-hours');
                const fm = document.getElementById('finish-minutes');
                const fa = document.getElementById('finish-ampm');
                if (fh) fh.value = timerState.finishTime.hours || '';
                if (fm) fm.value = timerState.finishTime.minutes || '';
                if (fa) fa.value = timerState.finishTime.ampm || 'PM';
            }

            if (timerState.timeline.length === 0) {
                addSegment();
            } else {
                renderSegments();
            }
            
            if (timerState.isRunning) {
                showTimerScreen();
                startTimerLoop();
            }
        }

        
        function setInputMode(mode) {
            timerState.inputMode = mode;

            // Toggle finish time row visibility
            const finishRow = document.getElementById('finishTimeRow');
            if (finishRow) {
                if (mode === 'clock') finishRow.classList.remove('hidden');
                else finishRow.classList.add('hidden');
            }

            // Toggle radio UI (in case called programmatically)
            const rdDur = document.getElementById('modeDuration');
            const rdClk = document.getElementById('modeClock');
            if (rdDur && rdClk) {
                rdDur.checked = mode === 'duration';
                rdClk.checked = mode === 'clock';
            }

            renderSegments();
            saveState();
        }

        function handleClockTimeInput(index, field, value) {
            value = value.replace(/\D/g, '');
            if (value.length > 2) value = value.slice(-2);
            const input = document.getElementById(`clock-${field}-${index}`);
            if (input) input.value = value;

            if (!timerState.timeline[index].startTime) {
                timerState.timeline[index].startTime = { hours: '', minutes: '', ampm: 'PM' };
            }
            timerState.timeline[index].startTime[field] = value;
        }

        function validateClockTimeInput(index) {
            const hEl = document.getElementById(`clock-hours-${index}`);
            const mEl = document.getElementById(`clock-minutes-${index}`);
            const aEl = document.getElementById(`clock-ampm-${index}`);
            const errEl = document.getElementById(`error-${index}`);

            const hVal = hEl ? hEl.value : '';
            const mVal = mEl ? mEl.value : '';
            const ampm = aEl ? aEl.value : 'PM';

            const hours = hVal ? parseInt(hVal, 10) : NaN;
            const minutes = mVal ? parseInt(mVal, 10) : NaN;

            // Store
            if (!timerState.timeline[index].startTime) {
                timerState.timeline[index].startTime = { hours: '', minutes: '', ampm: 'PM' };
            }
            timerState.timeline[index].startTime.ampm = ampm;

            // Validation
            if (Number.isNaN(hours) || Number.isNaN(minutes)) {
                if (errEl) errEl.textContent = 'Please enter a start time (HH and MM).';
                return false;
            }
            if (minutes >= 60) {
                if (errEl) errEl.textContent = 'Minutes must be less than 60.';
                return false;
            }
            if (hours < 0 || hours > 23) {
                if (errEl) errEl.textContent = 'Hours must be between 0 and 23.';
                return false;
            }

            // Pretty pad on blur
            if (hEl) hEl.value = hours.toString().padStart(2, '0');
            if (mEl) mEl.value = minutes.toString().padStart(2, '0');

            if (errEl) errEl.textContent = '';
            timerState.timeline[index].startTime.hours = hEl.value;
            timerState.timeline[index].startTime.minutes = mEl.value;
            return true;
        }

        function handleFinishTimeInput(field, value) {
            value = value.replace(/\D/g, '');
            if (value.length > 2) value = value.slice(-2);
            const input = document.getElementById(`finish-${field}`);
            if (input) input.value = value;
            timerState.finishTime[field] = value;
        }

        function validateFinishTime() {
            const hEl = document.getElementById('finish-hours');
            const mEl = document.getElementById('finish-minutes');
            const aEl = document.getElementById('finish-ampm');
            const errEl = document.getElementById('finish-error');

            const hVal = hEl ? hEl.value : '';
            const mVal = mEl ? mEl.value : '';
            const ampm = aEl ? aEl.value : 'PM';

            timerState.finishTime.ampm = ampm;

            const hours = hVal ? parseInt(hVal, 10) : NaN;
            const minutes = mVal ? parseInt(mVal, 10) : NaN;

            if (Number.isNaN(hours) || Number.isNaN(minutes)) {
                if (errEl) errEl.textContent = 'Please enter a finish time (HH and MM).';
                return false;
            }
            if (minutes >= 60) {
                if (errEl) errEl.textContent = 'Minutes must be less than 60.';
                return false;
            }
            if (hours < 0 || hours > 23) {
                if (errEl) errEl.textContent = 'Hours must be between 0 and 23.';
                return false;
            }

            if (hEl) hEl.value = hours.toString().padStart(2, '0');
            if (mEl) mEl.value = minutes.toString().padStart(2, '0');

            if (errEl) errEl.textContent = '';
            timerState.finishTime.hours = hEl.value;
            timerState.finishTime.minutes = mEl.value;
            saveState();
            return true;
        }

        function parseClockToMinutes(hStr, mStr, ampm) {
            // If hours is 0-23, we treat it as 24h and ignore am/pm.
            let h = parseInt(hStr, 10);
            let m = parseInt(mStr, 10);

            if (Number.isNaN(h) || Number.isNaN(m)) return null;
            if (m < 0 || m >= 60 || h < 0 || h > 23) return null;

            // If user is using 12-hour style (1-12), apply AM/PM conversion.
            // If they enter 0 or >12, keep as 24h.
            if (h >= 1 && h <= 12) {
                if (ampm === 'AM') {
                    if (h === 12) h = 0;
                } else if (ampm === 'PM') {
                    if (h !== 12) h = h + 12;
                }
            }

            return h * 60 + m;
        }

        function buildScheduleFromClockTimes() {
            // Validate all start times
            for (let i = 0; i < timerState.timeline.length; i++) {
                if (!validateClockTimeInput(i)) return false;
            }
            if (!validateFinishTime()) return false;

            // Convert entered clock times to minutes-of-day
            const timesMin = [];
            for (let i = 0; i < timerState.timeline.length; i++) {
                const st = timerState.timeline[i].startTime || {};
                const tMin = parseClockToMinutes(st.hours, st.minutes, st.ampm || 'PM');
                if (tMin === null) {
                    alert(`Invalid start time for Segment ${i + 1}.`);
                    return false;
                }
                timesMin.push(tMin);
            }

            const f = timerState.finishTime || {};
            const finishMinRaw = parseClockToMinutes(f.hours, f.minutes, f.ampm || 'PM');
            if (finishMinRaw === null) {
                alert('Invalid finish time.');
                return false;
            }

            // Make an absolute schedule anchored to today's local midnight
            const now = new Date();
            const base = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0).getTime();

            // Apply rollover (midnight crossing) by adding 24h as needed
            const absStarts = [];
            let dayOffsetMin = 0;
            for (let i = 0; i < timesMin.length; i++) {
                let t = timesMin[i] + dayOffsetMin;
                if (i > 0) {
                    while (t < absStarts[i - 1]) {
                        dayOffsetMin += 24 * 60;
                        t = timesMin[i] + dayOffsetMin;
                    }
                }
                absStarts.push(t);
            }

            let finishAbsMin = finishMinRaw + dayOffsetMin;
            while (finishAbsMin < absStarts[absStarts.length - 1]) {
                finishAbsMin += 24 * 60;
            }

            const scheduleStartsAbsMs = absStarts.map(min => base + min * 60 * 1000);
            const scheduleFinishAbsMs = base + finishAbsMin * 60 * 1000;

            // Validate non-zero durations
            for (let i = 0; i < scheduleStartsAbsMs.length; i++) {
                const start = scheduleStartsAbsMs[i];
                const end = (i < scheduleStartsAbsMs.length - 1) ? scheduleStartsAbsMs[i + 1] : scheduleFinishAbsMs;
                if (end <= start) {
                    alert(`Segment ${i + 1} has zero or negative duration. Please check your times.`);
                    return false;
                }
            }

            timerState.scheduleStartsAbsMs = scheduleStartsAbsMs;
            timerState.scheduleFinishAbsMs = scheduleFinishAbsMs;
            timerState.scheduleOffsetMs = 0;

            // Keep timeline durations in sync with schedule (seconds)
            syncDurationsFromSchedule();

            return true;
        }

        function getEffectiveNowMs() {
            return Date.now() - (timerState.scheduleOffsetMs || 0);
        }

        function syncDurationsFromSchedule() {
            if (!timerState.scheduleStartsAbsMs || !timerState.scheduleFinishAbsMs) return;
            for (let i = 0; i < timerState.timeline.length; i++) {
                const start = timerState.scheduleStartsAbsMs[i];
                const end = (i < timerState.timeline.length - 1) ? timerState.scheduleStartsAbsMs[i + 1] : timerState.scheduleFinishAbsMs;
                timerState.timeline[i].duration = Math.max(1, Math.round((end - start) / 1000));
            }
        }

        function getSegmentEndMs(index) {
            if (!timerState.scheduleStartsAbsMs || !timerState.scheduleFinishAbsMs) return null;
            return (index < timerState.timeline.length - 1)
                ? timerState.scheduleStartsAbsMs[index + 1]
                : timerState.scheduleFinishAbsMs;
        }

        function findSegmentIndexForTime(effectiveNowMs) {
            if (!timerState.scheduleStartsAbsMs || !timerState.scheduleFinishAbsMs) return null;
            if (effectiveNowMs < timerState.scheduleStartsAbsMs[0]) return -1; // waiting
            if (effectiveNowMs >= timerState.scheduleFinishAbsMs) return timerState.timeline.length; // finished

            // Linear scan (timeline is usually small)
            for (let i = 0; i < timerState.timeline.length; i++) {
                const start = timerState.scheduleStartsAbsMs[i];
                const end = getSegmentEndMs(i);
                if (effectiveNowMs >= start && effectiveNowMs < end) return i;
            }
            return timerState.timeline.length; // fallback
        }

        function getReadingElapsedSecondsBetween(startMs, endMs) {
            if (!timerState.scheduleStartsAbsMs || !timerState.scheduleFinishAbsMs) return 0;
            if (endMs <= startMs) return 0;

            let totalMs = 0;
            for (let i = 0; i < timerState.timeline.length; i++) {
                if (timerState.timeline[i].isBreak) continue;
                const segStart = timerState.scheduleStartsAbsMs[i];
                const segEnd = getSegmentEndMs(i);
                const a = Math.max(startMs, segStart);
                const b = Math.min(endMs, segEnd);
                if (b > a) totalMs += (b - a);
            }
            return totalMs / 1000;
        }

        function applyClockJumpWarning(systemNowMs, expectedDeltaMs) {
            const warningEl = document.getElementById('clockWarning');
            if (!warningEl) return;

            const last = timerState.lastSystemNowMs;
            timerState.lastSystemNowMs = systemNowMs;

            if (!last) {
                warningEl.style.display = 'none';
                warningEl.textContent = '';
                return;
            }

            const actualDelta = systemNowMs - last;
            // If the system clock jumps by more than 30s relative to our expected tick cadence, warn.
            if (Math.abs(actualDelta - expectedDeltaMs) > 30000) {
                warningEl.textContent = '⚠️ System clock changed — schedule re-synced';
                warningEl.style.display = 'block';
            } else {
                warningEl.style.display = 'none';
                warningEl.textContent = '';
            }
        }

function addSegment() {
            const segment = {
                duration: 0,
                isBreak: timerState.timeline.length % 2 === 1,
                startTime: { hours: '', minutes: '', ampm: 'PM' }
            };
            timerState.timeline.push(segment);
            renderSegments();
        }

        function removeSegment(index) {
            timerState.timeline.splice(index, 1);
            renderSegments();
        }

        function renderSegments() {
            const container = document.getElementById('timelineSegments');
            container.innerHTML = '';

            timerState.timeline.forEach((segment, index) => {
                const div = document.createElement('div');
                div.className = 'timeline-segment';
                
                // Convert seconds to HH, MM, SS
                const hours = Math.floor(segment.duration / 3600);
                const minutes = Math.floor((segment.duration % 3600) / 60);
                const secs = segment.duration % 60;
                
                div.innerHTML = (timerState.inputMode === 'clock') ? `
                    <div class="segment-label">Segment ${index + 1}: ${segment.isBreak ? 'Break' : 'Reading'}</div>
                    <div class="segment-inputs">
                        <div class="input-group">
                            <label>Start Time:</label>
                            <div class="time-input-container">
                                <input type="text" class="time-input-box" id="clock-hours-${index}" 
                                       placeholder="HH" maxlength="2"
                                       oninput="handleClockTimeInput(${index}, 'hours', this.value)"
                                       onfocus="this.select()"
                                       onblur="validateClockTimeInput(${index})">
                                <span class="time-input-separator">:</span>
                                <input type="text" class="time-input-box" id="clock-minutes-${index}" 
                                       placeholder="MM" maxlength="2"
                                       oninput="handleClockTimeInput(${index}, 'minutes', this.value)"
                                       onfocus="this.select()"
                                       onblur="validateClockTimeInput(${index})">
                                <select class="ampm-select" id="clock-ampm-${index}" onchange="validateClockTimeInput(${index})">
                                    <option value="AM" ${(segment.startTime && segment.startTime.ampm === 'AM') ? 'selected' : ''}>AM</option>
                                    <option value="PM" ${(segment.startTime && (!segment.startTime.ampm || segment.startTime.ampm === 'PM')) ? 'selected' : ''}>PM</option>
                                </select>
                            </div>
                            <div class="time-input-error" id="error-${index}"></div>
                        </div>
                        <div class="input-group">
                            <label>Type:</label>
                            <select onchange="toggleSegmentType(${index})">
                                <option value="reading" ${!segment.isBreak ? 'selected' : ''}>Reading</option>
                                <option value="break" ${segment.isBreak ? 'selected' : ''}>Break</option>
                            </select>
                        </div>
                        <button class="btn-danger" onclick="removeSegment(${index})">Remove</button>
                    </div>
                ` : `
                    <div class="segment-label">Segment ${index + 1}: ${segment.isBreak ? 'Break' : 'Reading'}</div>
                    <div class="segment-inputs">
                        <div class="input-group">
                            <label>Duration:</label>
                            <div class="time-input-container">
                                <input type="text" class="time-input-box" id="hours-${index}" 
                                       placeholder="00" maxlength="2"
                                       oninput="handleTimeInput(${index}, 'hours', this.value)"
                                       onfocus="this.select()"
                                       onblur="validateTimeInput(${index})">
                                <span class="time-input-separator">:</span>
                                <input type="text" class="time-input-box" id="minutes-${index}" 
                                       placeholder="00" maxlength="2"
                                       oninput="handleTimeInput(${index}, 'minutes', this.value)"
                                       onfocus="this.select()"
                                       onblur="validateTimeInput(${index})">
                                <span class="time-input-separator">:</span>
                                <input type="text" class="time-input-box" id="seconds-${index}" 
                                       placeholder="00" maxlength="2"
                                       oninput="handleTimeInput(${index}, 'seconds', this.value)"
                                       onfocus="this.select()"
                                       onblur="validateTimeInput(${index})">
                            </div>
                            <div class="time-input-error" id="error-${index}"></div>
                        </div>
                        <div class="input-group">
                            <label>Type:</label>
                            <select onchange="toggleSegmentType(${index})">
                                <option value="reading" ${!segment.isBreak ? 'selected' : ''}>Reading</option>
                                <option value="break" ${segment.isBreak ? 'selected' : ''}>Break</option>
                            </select>
                        </div>
                        <button class="btn-danger" onclick="removeSegment(${index})">Remove</button>
                    </div>
                `;
                container.appendChild(div);
                
                // Set values after elements are added to DOM
                setTimeout(() => {
                    if (timerState.inputMode === 'clock') {
                        const st = segment.startTime || { hours: '', minutes: '', ampm: 'PM' };
                        const hEl = document.getElementById(`clock-hours-${index}`);
                        const mEl = document.getElementById(`clock-minutes-${index}`);
                        const aEl = document.getElementById(`clock-ampm-${index}`);
                        if (hEl) hEl.value = st.hours || '';
                        if (mEl) mEl.value = st.minutes || '';
                        if (aEl) aEl.value = st.ampm || 'PM';
                    } else {
                        // Convert seconds to HH, MM, SS for duration mode
                        const hours = Math.floor(segment.duration / 3600);
                        const minutes = Math.floor((segment.duration % 3600) / 60);
                        const secs = segment.duration % 60;

                        if (hours > 0 || minutes > 0 || secs > 0) {
                            const hEl = document.getElementById(`hours-${index}`);
                            const mEl = document.getElementById(`minutes-${index}`);
                            const sEl = document.getElementById(`seconds-${index}`);
                            if (hEl) hEl.value = hours > 0 ? hours.toString().padStart(2, '0') : '';
                            if (mEl) mEl.value = minutes > 0 ? minutes.toString().padStart(2, '0') : '';
                            if (sEl) sEl.value = secs > 0 ? secs.toString().padStart(2, '0') : '';
                        }
                    }
                }, 0);
            });
        }

        function handleTimeInput(index, field, value) {
            // Remove non-digits
            value = value.replace(/\D/g, '');
            
            const input = document.getElementById(`${field}-${index}`);
            
            // If value is too long, trim it
            if (value.length > 2) {
                value = value.slice(-2);
            }
            
            // Update display (no padding during input)
            input.value = value;
            
            // Update the segment duration
            updateSegmentFromInputs(index);
        }

        function updateSegmentFromInputs(index) {
            const hoursVal = document.getElementById(`hours-${index}`).value;
            const minutesVal = document.getElementById(`minutes-${index}`).value;
            const secondsVal = document.getElementById(`seconds-${index}`).value;
            
            const hours = hoursVal ? parseInt(hoursVal) : 0;
            const minutes = minutesVal ? parseInt(minutesVal) : 0;
            const seconds = secondsVal ? parseInt(secondsVal) : 0;
            
            timerState.timeline[index].duration = hours * 3600 + minutes * 60 + seconds;
        }

        function validateTimeInput(index) {
            const hoursInput = document.getElementById(`hours-${index}`);
            const minutesInput = document.getElementById(`minutes-${index}`);
            const secondsInput = document.getElementById(`seconds-${index}`);
            
            const hoursVal = hoursInput.value;
            const minutesVal = minutesInput.value;
            const secondsVal = secondsInput.value;
            
            const hours = hoursVal ? parseInt(hoursVal) : 0;
            const minutes = minutesVal ? parseInt(minutesVal) : 0;
            const seconds = secondsVal ? parseInt(secondsVal) : 0;
            
            const errorDiv = document.getElementById(`error-${index}`);
            
            if (minutes >= 60 || seconds >= 60) {
                errorDiv.textContent = 'Please enter a valid value (minutes and seconds must be less than 60)';
                return false;
            } else {
                errorDiv.textContent = '';
                // Pad with zeros on blur (only if there's a value)
                if (hoursVal) hoursInput.value = hours.toString().padStart(2, '0');
                if (minutesVal) minutesInput.value = minutes.toString().padStart(2, '0');
                if (secondsVal) secondsInput.value = seconds.toString().padStart(2, '0');
                updateSegmentFromInputs(index);
                return true;
            }
        }

        function toggleSegmentType(index) {
            timerState.timeline[index].isBreak = !timerState.timeline[index].isBreak;
            renderSegments();
        }

        function startTimer() {
            timerState.totalPages = parseInt(document.getElementById('totalPages').value) || 604;
            timerState.originalTotalPages = timerState.totalPages;  // Store original

            // Clock-time mode: build a system-time anchored schedule
            if (timerState.inputMode === 'clock') {
                if (!buildScheduleFromClockTimes()) {
                    return;
                }
            }

            
            if (timerState.timeline.length === 0) {
                alert('Please add at least one segment to the timeline.');
                return;
            }

            // Validate that all segments have durations greater than 0
            for (let i = 0; i < timerState.timeline.length; i++) {
                if (timerState.timeline[i].duration === 0) {
                    alert(`Please enter a duration for Segment ${i + 1} before starting.`);
                    return;
                }
            }

            // Calculate total reading time (in seconds)
            timerState.totalReadingTime = timerState.timeline
                .filter(s => !s.isBreak)
                .reduce((sum, s) => sum + s.duration, 0);

            if (timerState.totalReadingTime === 0) {
                alert('Please add at least one reading segment.');
                return;
            }

            // Initialize timer
            timerState.currentSegmentIndex = 0;
            timerState.segmentTimeRemaining = timerState.timeline[0].duration;
            timerState.currentPage = 1;
            timerState.isPaused = false;
            timerState.isRunning = true;
            timerState.lastTickTime = Date.now();
            timerState.actualElapsedReadingTime = 0;

            if (timerState.inputMode === 'clock') {
                // In clock mode, page pacing starts from the first scheduled start time
                timerState.rateResetAbsMs = timerState.scheduleStartsAbsMs ? timerState.scheduleStartsAbsMs[0] : null;

                const effectiveNow = getEffectiveNowMs();
                timerState.waitingToStart = (timerState.scheduleStartsAbsMs && effectiveNow < timerState.scheduleStartsAbsMs[0]);

                // Immediately sync to the correct segment if user starts late
                if (!timerState.waitingToStart) {
                    syncClockModeToNow(true);
                } else {
                    // Waiting state: show countdown until first start
                    timerState.currentSegmentIndex = 0;
                    timerState.segmentTimeRemaining = Math.max(0, (timerState.scheduleStartsAbsMs[0] - effectiveNow) / 1000);
                    timerState.currentPage = 1;
                }
            }

            saveState();
            showTimerScreen();
            startTimerLoop();
        }

        function showTimerScreen() {
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('timerScreen').classList.remove('hidden');
            // Reset progress bar initialization when showing timer screen
            const progressBar = document.getElementById('progressBar');
            if (progressBar) {
                progressBar.removeAttribute('data-initialized');
            }
            updateDisplay();
        }

        function startTimerLoop() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (!timerState.isPaused && timerState.isRunning) {
                    tick();
                }
            }, 100); // Update every 100ms for smooth display
        }

        
        function shiftScheduleFromIndex(startIndex, deltaMs) {
            if (!timerState.scheduleStartsAbsMs || !timerState.scheduleFinishAbsMs) return;
            for (let i = startIndex; i < timerState.scheduleStartsAbsMs.length; i++) {
                timerState.scheduleStartsAbsMs[i] += deltaMs;
            }
            timerState.scheduleFinishAbsMs += deltaMs;
            syncDurationsFromSchedule();
        }

        function syncClockModeToNow(allowPageAdvance) {
            if (timerState.inputMode !== 'clock') return;
            if (!timerState.scheduleStartsAbsMs || !timerState.scheduleFinishAbsMs) return;

            const effectiveNow = getEffectiveNowMs();

            const idx = findSegmentIndexForTime(effectiveNow);
            if (idx === -1) {
                timerState.waitingToStart = true;
                timerState.currentSegmentIndex = 0;
                timerState.segmentTimeRemaining = Math.max(0, (timerState.scheduleStartsAbsMs[0] - effectiveNow) / 1000);
                timerState.currentPage = 1;
                return;
            }
            if (idx >= timerState.timeline.length) {
                completeTimer();
                return;
            }

            timerState.waitingToStart = false;
            timerState.currentSegmentIndex = idx;

            const end = getSegmentEndMs(idx);
            timerState.segmentTimeRemaining = Math.max(0, (end - effectiveNow) / 1000);

            // Page counter in clock mode: based on reading-time elapsed since rateResetAbsMs
            const rateStart = timerState.rateResetAbsMs ?? timerState.scheduleStartsAbsMs[0];
            const readingElapsed = getReadingElapsedSecondsBetween(rateStart, effectiveNow);

            const secondsPerPage = timerState.totalReadingTime / timerState.totalPages;
            const basePageNumber = timerState.originalTotalPages - timerState.totalPages;
            const pagesProgressed = Math.floor(readingElapsed / secondsPerPage);
            const calculatedPage = Math.min(basePageNumber + pagesProgressed, timerState.originalTotalPages);

            if (allowPageAdvance) {
                timerState.currentPage = Math.max(timerState.currentPage, calculatedPage);
            } else {
                // preserve
                timerState.currentPage = timerState.currentPage;
            }
        }

function tick() {
            const systemNow = Date.now();
            const expectedDeltaMs = 100; // our interval is 100ms
            applyClockJumpWarning(systemNow, expectedDeltaMs);

            if (timerState.inputMode === 'clock') {
                // Clock mode: derive everything from system time (effectiveNow)
                // When waiting to start, show countdown until the first start
                const effectiveNow = getEffectiveNowMs();

                if (timerState.scheduleStartsAbsMs && effectiveNow < timerState.scheduleStartsAbsMs[0]) {
                    timerState.waitingToStart = true;
                    timerState.currentSegmentIndex = 0;
                    timerState.segmentTimeRemaining = Math.max(0, (timerState.scheduleStartsAbsMs[0] - effectiveNow) / 1000);
                    timerState.currentPage = 1;
                } else {
                    // Sync to schedule
                    syncClockModeToNow(true);
                }

                updateDisplay();
                saveState();
                return;
            }

            // Duration mode (original behavior)
            const now = Date.now();
            const elapsed = (now - timerState.lastTickTime) / 1000;
            timerState.lastTickTime = now;

            timerState.segmentTimeRemaining -= elapsed;

            // Update page counter if in reading mode (and only if we're actively reading)
            const currentSegment = timerState.timeline[timerState.currentSegmentIndex];
            if (!currentSegment.isBreak) {
                // Increment actual elapsed reading time
                timerState.actualElapsedReadingTime += elapsed;

                const secondsPerPage = timerState.totalReadingTime / timerState.totalPages;

                // Calculate page progress from the base (after adjustments, we reset to current page)
                // We need to figure out what our base page is
                const basePageNumber = timerState.originalTotalPages - timerState.totalPages;
                const pagesProgressed = Math.floor(timerState.actualElapsedReadingTime / secondsPerPage);
                const calculatedPage = Math.min(
                    basePageNumber + pagesProgressed,
                    timerState.originalTotalPages
                );

                // Only update if calculated page is higher (prevents going backwards after adjustments)
                if (calculatedPage > timerState.currentPage) {
                    timerState.currentPage = calculatedPage;
                }
            }

            // Move to next segment if current one is finished
            if (timerState.segmentTimeRemaining <= 0) {
                timerState.currentSegmentIndex++;

                if (timerState.currentSegmentIndex >= timerState.timeline.length) {
                    // Timer completed
                    completeTimer();
                    return;
                }

                timerState.segmentTimeRemaining = timerState.timeline[timerState.currentSegmentIndex].duration;
            }

            updateDisplay();
            saveState();
        }

        function getElapsedReadingTime() {
            let elapsed = 0;
            
            // Add completed segments
            for (let i = 0; i < timerState.currentSegmentIndex; i++) {
                if (!timerState.timeline[i].isBreak) {
                    elapsed += timerState.timeline[i].duration;
                }
            }
            
            // Add current segment if it's reading
            const currentSegment = timerState.timeline[timerState.currentSegmentIndex];
            if (!currentSegment.isBreak) {
                const segmentDuration = currentSegment.duration;
                elapsed += segmentDuration - timerState.segmentTimeRemaining;
            }
            
            return elapsed;
        }

        function updateDisplay() {
            const currentSegment = timerState.timeline[timerState.currentSegmentIndex];
            const statusIndicator = document.getElementById('statusIndicator');
            const countdownTimer = document.getElementById('countdownTimer');
            const pageCounter = document.getElementById('pageCounter');
            const timelineProgress = document.getElementById('timelineProgress');
            const pauseBtn = document.getElementById('pauseBtn');

            // Update status
            if (timerState.isPaused) {
                statusIndicator.textContent = 'Paused';
                statusIndicator.className = 'status-indicator status-paused';
                pauseBtn.textContent = 'Resume';
            } else if (timerState.inputMode === 'clock' && timerState.waitingToStart) {
                statusIndicator.textContent = 'Waiting to Start';
                statusIndicator.className = 'status-indicator status-paused';
                pauseBtn.textContent = 'Pause';
            } else if (currentSegment.isBreak) {
                statusIndicator.textContent = 'Break Time';
                statusIndicator.className = 'status-indicator status-break';
                pauseBtn.textContent = 'Pause';
            } else {
                statusIndicator.textContent = 'Reading';
                statusIndicator.className = 'status-indicator status-reading';
                pauseBtn.textContent = 'Pause';
            }

            // Update countdown timer
            const time = Math.max(0, Math.ceil(timerState.segmentTimeRemaining));
            const hours = Math.floor(time / 3600);
            const minutes = Math.floor((time % 3600) / 60);
            const seconds = time % 60;

            if (hours > 0) {
                countdownTimer.textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                countdownTimer.textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            // Update page counter
            pageCounter.textContent = timerState.currentPage;

            // Update timeline progress
            timelineProgress.textContent = 
                `Segment ${timerState.currentSegmentIndex + 1} of ${timerState.timeline.length}`;

            // Update progress bar
            updateProgressBar();

            // Calculate and update mini clocks
            updateMiniClocks();
        }

        function updateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            const progressIndicator = document.getElementById('progressIndicator');
            const progressCompletedOverlay = document.getElementById('progressCompletedOverlay');

            const totalDuration = timerState.timeline.reduce((sum, seg) => sum + seg.duration, 0);

            let elapsedTime = 0;

            if (timerState.inputMode === 'clock' && timerState.scheduleStartsAbsMs && timerState.scheduleFinishAbsMs) {
                const effectiveNow = getEffectiveNowMs();
                const start0 = timerState.scheduleStartsAbsMs[0];
                const endAll = timerState.scheduleFinishAbsMs;
                if (effectiveNow <= start0) {
                    elapsedTime = 0;
                } else if (effectiveNow >= endAll) {
                    elapsedTime = totalDuration;
                } else {
                    elapsedTime = (effectiveNow - start0) / 1000; // seconds
                }
            } else {
                // Duration mode: Calculate elapsed time based on segment progress
                for (let i = 0; i < timerState.currentSegmentIndex; i++) {
                    elapsedTime += timerState.timeline[i].duration;
                }
                const currentSegmentElapsed = timerState.timeline[timerState.currentSegmentIndex].duration - timerState.segmentTimeRemaining;
                elapsedTime += currentSegmentElapsed;
            }

            const progressPercentage = totalDuration > 0 ? (elapsedTime / totalDuration) * 100 : 0;

            // Build segments HTML (only once or when timeline changes)
            if (!progressBar.hasAttribute('data-initialized')) {
                let htmlSegs = '';
                timerState.timeline.forEach((segment) => {
                    const percentage = totalDuration > 0 ? (segment.duration / totalDuration) * 100 : 0;
                    const segmentClass = segment.isBreak ? 'break' : 'reading';
                    htmlSegs += `<div class="progress-segment ${segmentClass}" style="width: ${percentage}%"></div>`;
                });

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlSegs;

                progressBar.innerHTML = '';
                while (tempDiv.firstChild) {
                    progressBar.appendChild(tempDiv.firstChild);
                }
                progressBar.appendChild(progressCompletedOverlay);
                progressBar.appendChild(progressIndicator);

                progressBar.setAttribute('data-initialized', 'true');
            }

            progressCompletedOverlay.style.width = `${Math.max(0, Math.min(100, progressPercentage))}%`;
            progressIndicator.style.left = `${Math.max(0, Math.min(100, progressPercentage))}%`;
        }

        function updateMiniClocks() {
            let readingTimeRemaining = 0;
            let totalTimeRemaining = 0;

            if (timerState.inputMode === 'clock' && timerState.scheduleStartsAbsMs && timerState.scheduleFinishAbsMs) {
                const effectiveNow = getEffectiveNowMs();

                // Total time remaining: from now to finish (never negative)
                totalTimeRemaining = Math.max(0, (timerState.scheduleFinishAbsMs - effectiveNow) / 1000);

                // Reading time remaining: sum remaining parts of reading segments from now to finish
                for (let i = 0; i < timerState.timeline.length; i++) {
                    if (timerState.timeline[i].isBreak) continue;
                    const segStart = timerState.scheduleStartsAbsMs[i];
                    const segEnd = getSegmentEndMs(i);

                    const a = Math.max(effectiveNow, segStart);
                    const b = segEnd;
                    if (b > a) readingTimeRemaining += (b - a) / 1000;
                }

                // If waiting to start, clamp reading remaining to full remaining reading time (already handled above)
                if (effectiveNow < timerState.scheduleStartsAbsMs[0]) {
                    readingTimeRemaining = timerState.timeline
                        .filter(s => !s.isBreak)
                        .reduce((sum, s) => sum + s.duration, 0);
                }
            } else {
                // Duration mode (original behavior)
                const currentSegment = timerState.timeline[timerState.currentSegmentIndex];

                if (!currentSegment.isBreak) {
                    readingTimeRemaining += timerState.segmentTimeRemaining;
                }

                for (let i = timerState.currentSegmentIndex + 1; i < timerState.timeline.length; i++) {
                    if (!timerState.timeline[i].isBreak) {
                        readingTimeRemaining += timerState.timeline[i].duration;
                    }
                }

                totalTimeRemaining = timerState.segmentTimeRemaining;
                for (let i = timerState.currentSegmentIndex + 1; i < timerState.timeline.length; i++) {
                    totalTimeRemaining += timerState.timeline[i].duration;
                }
            }

            document.getElementById('readingTimeRemaining').textContent = formatTime(Math.ceil(readingTimeRemaining));
            document.getElementById('totalTimeRemaining').textContent = formatTime(Math.ceil(totalTimeRemaining));
        }

        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function togglePause() {
            if (timerState.inputMode === 'clock') {
                // Clock mode pause is a meaningful hold: shift schedule forward by paused duration.
                timerState.isPaused = !timerState.isPaused;

                if (timerState.isPaused) {
                    timerState.pausedAtSystemMs = Date.now();
                } else {
                    const resumeNow = Date.now();
                    const pausedFor = timerState.pausedAtSystemMs ? (resumeNow - timerState.pausedAtSystemMs) : 0;
                    timerState.scheduleOffsetMs = (timerState.scheduleOffsetMs || 0) + pausedFor;
                    timerState.pausedAtSystemMs = null;

                    // Prevent a jump in duration-mode tick logic (not used here, but keep consistent)
                    timerState.lastTickTime = Date.now();

                    // Re-sync immediately
                    syncClockModeToNow(false);
                }

                updateDisplay();
                saveState();
                return;
            }

            // Duration mode (original)
            timerState.isPaused = !timerState.isPaused;
            if (!timerState.isPaused) {
                timerState.lastTickTime = Date.now();
            }
            updateDisplay();
            saveState();
        }

        function resetTimer() {
            if (confirm('Are you sure you want to reset? All progress will be lost.')) {
                if (timerInterval) clearInterval(timerInterval);
                timerState.isRunning = false;
                timerState.isPaused = false;
                saveState();
                document.getElementById('timerScreen').classList.add('hidden');
                document.getElementById('setupScreen').classList.remove('hidden');
            }
        }

        function completeTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerState.isRunning = false;
            alert('Alhamdulillah! Khatmah completed! 🎉');
            resetTimer();
        }

        function openAdjustTimeOverlay() {
            // Reset the input fields to empty
            document.getElementById('adjust-hours').value = '';
            document.getElementById('adjust-minutes').value = '';
            document.getElementById('adjust-seconds').value = '';
            document.getElementById('adjust-error').textContent = '';
            
            // Show overlay (timer continues in background)
            document.getElementById('adjustTimeOverlay').classList.remove('hidden');
        }

        function closeAdjustTimeOverlay() {
            document.getElementById('adjustTimeOverlay').classList.add('hidden');
        }

        function handleAdjustTimeInput(field, value) {
            // Remove non-digits
            value = value.replace(/\D/g, '');
            
            const input = document.getElementById(`adjust-${field}`);
            
            // If value is too long, trim it
            if (value.length > 2) {
                value = value.slice(-2);
            }
            
            // Update display (no padding during input)
            input.value = value;
        }

        function validateAdjustTime() {
            const hoursVal = document.getElementById('adjust-hours').value;
            const minutesVal = document.getElementById('adjust-minutes').value;
            const secondsVal = document.getElementById('adjust-seconds').value;
            
            const hours = hoursVal ? parseInt(hoursVal) : 0;
            const minutes = minutesVal ? parseInt(minutesVal) : 0;
            const seconds = secondsVal ? parseInt(secondsVal) : 0;
            
            const errorDiv = document.getElementById('adjust-error');
            
            if (minutes >= 60 || seconds >= 60) {
                errorDiv.textContent = 'Please enter a valid value (minutes and seconds must be less than 60)';
                return null;
            }
            
            const totalSeconds = hours * 3600 + minutes * 60 + seconds;
            if (totalSeconds === 0) {
                errorDiv.textContent = 'Please enter a time amount greater than zero';
                return null;
            }
            
            errorDiv.textContent = '';
            return totalSeconds;
        }

        function adjustTime(action) {
            const adjustSeconds = validateAdjustTime();
            if (adjustSeconds === null) return;

            const actionText = action === 'add' ? 'add' : 'subtract';
            const timeStr = formatTime(adjustSeconds);

            // Preserve current page before adjustment
            const preservedPage = timerState.currentPage;

            setTimeout(() => {
                if (!confirm(`Are you sure you want to ${actionText} ${timeStr} ${action === 'add' ? 'to' : 'from'} the current segment?`)) {
                    return;
                }

                // Clock mode: shift schedule (meaningful adjustment)
                if (timerState.inputMode === 'clock') {
                    if (!timerState.scheduleStartsAbsMs || !timerState.scheduleFinishAbsMs) return;

                    // Ensure we're synced to "now" first
                    syncClockModeToNow(false);

                    const idx = timerState.currentSegmentIndex;
                    const deltaMs = (action === 'add' ? 1 : -1) * adjustSeconds * 1000;

                    // Current segment is [start, end). We adjust its END by shifting everything after it.
                    const start = timerState.scheduleStartsAbsMs[idx];
                    const oldEnd = getSegmentEndMs(idx);
                    const newEnd = oldEnd + deltaMs;

                    // If subtract makes segment non-positive, advance to next segment instead
                    if (newEnd <= start + 1000) {
                        // Equivalent to skipping to next segment
                        skipToNextSegmentInternal(preservedPage);
                        closeAdjustTimeOverlay();
                        return;
                    }

                    // Shift all future segment starts and finish by deltaMs
                    shiftScheduleFromIndex(idx + 1, deltaMs);

                    // Keep rate pacing consistent with preserve-page approach:
                    // Recompute remaining reading time and pages remaining, then reset rateResetAbsMs to now.
                    const effectiveNow = getEffectiveNowMs();
                    const pagesRemaining = timerState.originalTotalPages - preservedPage;

                    // Remaining reading time from now to finish (seconds)
                    let remainingReadingSeconds = 0;
                    for (let i = 0; i < timerState.timeline.length; i++) {
                        if (timerState.timeline[i].isBreak) continue;
                        const segStart = timerState.scheduleStartsAbsMs[i];
                        const segEnd = getSegmentEndMs(i);
                        const a = Math.max(effectiveNow, segStart);
                        const b = segEnd;
                        if (b > a) remainingReadingSeconds += (b - a) / 1000;
                    }

                    timerState.totalReadingTime = remainingReadingSeconds;
                    timerState.totalPages = Math.max(1, pagesRemaining);
                    timerState.rateResetAbsMs = effectiveNow;
                    timerState.currentPage = preservedPage;

                    // Re-sync view (but do not advance page during this sync)
                    syncClockModeToNow(false);

                    // Force progress bar rebuild
                    const progressBar = document.getElementById('progressBar');
                    if (progressBar) progressBar.removeAttribute('data-initialized');

                    updateDisplay();
                    saveState();
                    closeAdjustTimeOverlay();
                    return;
                }

                // Duration mode (original behavior)
                const preservedPage2 = timerState.currentPage;

                if (action === 'add') {
                    timerState.segmentTimeRemaining += adjustSeconds;
                    timerState.timeline[timerState.currentSegmentIndex].duration += adjustSeconds;
                } else {
                    timerState.segmentTimeRemaining -= adjustSeconds;
                    timerState.timeline[timerState.currentSegmentIndex].duration -= adjustSeconds;

                    if (timerState.segmentTimeRemaining <= 0) {
                        timerState.currentSegmentIndex++;

                        if (timerState.currentSegmentIndex >= timerState.timeline.length) {
                            completeTimer();
                            closeAdjustTimeOverlay();
                            return;
                        }

                        timerState.segmentTimeRemaining = timerState.timeline[timerState.currentSegmentIndex].duration;
                    }
                }

                let remainingReadingTime = 0;
                const currentSegment = timerState.timeline[timerState.currentSegmentIndex];

                if (!currentSegment.isBreak) {
                    remainingReadingTime += timerState.segmentTimeRemaining;
                }

                for (let i = timerState.currentSegmentIndex + 1; i < timerState.timeline.length; i++) {
                    if (!timerState.timeline[i].isBreak) {
                        remainingReadingTime += timerState.timeline[i].duration;
                    }
                }

                const pagesRemaining2 = timerState.originalTotalPages - preservedPage2;

                timerState.totalReadingTime = remainingReadingTime;
                timerState.totalPages = pagesRemaining2;

                timerState.actualElapsedReadingTime = 0;
                timerState.currentPage = preservedPage2;

                const progressBar2 = document.getElementById('progressBar');
                if (progressBar2) {
                    progressBar2.removeAttribute('data-initialized');
                }

                updateDisplay();
                saveState();

                closeAdjustTimeOverlay();
            }, 0);
        }

        function skipToNextSegmentInternal(preservedPage) {
            if (!timerState.scheduleStartsAbsMs || !timerState.scheduleFinishAbsMs) return;

            const effectiveNow = getEffectiveNowMs();
            const idx = findSegmentIndexForTime(effectiveNow);

            if (idx === -1) {
                // If waiting, jump to first segment
                const delta = timerState.scheduleStartsAbsMs[0] - effectiveNow;
                timerState.scheduleOffsetMs = (timerState.scheduleOffsetMs || 0) - delta;
            } else if (idx >= timerState.timeline.length) {
                completeTimer();
                return;
            } else {
                const nextIdx = idx + 1;
                if (nextIdx >= timerState.timeline.length) {
                    completeTimer();
                    return;
                }
                const nextStart = timerState.scheduleStartsAbsMs[nextIdx];
                const delta = nextStart - effectiveNow;
                // Shift effective time forward to next start immediately
                timerState.scheduleOffsetMs = (timerState.scheduleOffsetMs || 0) - delta;
            }

            const newEffectiveNow = getEffectiveNowMs();

            // Recompute remaining reading pacing based on preserved page
            const pagesRemaining = timerState.originalTotalPages - preservedPage;

            let remainingReadingSeconds = 0;
            for (let i = 0; i < timerState.timeline.length; i++) {
                if (timerState.timeline[i].isBreak) continue;
                const segStart = timerState.scheduleStartsAbsMs[i];
                const segEnd = getSegmentEndMs(i);
                const a = Math.max(newEffectiveNow, segStart);
                const b = segEnd;
                if (b > a) remainingReadingSeconds += (b - a) / 1000;
            }

            timerState.totalReadingTime = remainingReadingSeconds;
            timerState.totalPages = Math.max(1, pagesRemaining);
            timerState.rateResetAbsMs = newEffectiveNow;
            timerState.currentPage = preservedPage;

            syncClockModeToNow(false);
        }

        function skipToNextSegment() {
            const preservedPage = timerState.currentPage;

            setTimeout(() => {
                if (!confirm('Are you sure you want to skip to the next segment?')) {
                    return;
                }

                if (timerState.inputMode === 'clock') {
                    skipToNextSegmentInternal(preservedPage);

                    const progressBar = document.getElementById('progressBar');
                    if (progressBar) progressBar.removeAttribute('data-initialized');

                    updateDisplay();
                    saveState();
                    closeAdjustTimeOverlay();
                    return;
                }

                // Duration mode (original)
                timerState.currentSegmentIndex++;

                if (timerState.currentSegmentIndex >= timerState.timeline.length) {
                    completeTimer();
                    closeAdjustTimeOverlay();
                    return;
                }

                timerState.segmentTimeRemaining = timerState.timeline[timerState.currentSegmentIndex].duration;

                let remainingReadingTime = 0;
                const currentSegment = timerState.timeline[timerState.currentSegmentIndex];

                if (!currentSegment.isBreak) {
                    remainingReadingTime += timerState.segmentTimeRemaining;
                }

                for (let i = timerState.currentSegmentIndex + 1; i < timerState.timeline.length; i++) {
                    if (!timerState.timeline[i].isBreak) {
                        remainingReadingTime += timerState.timeline[i].duration;
                    }
                }

                const pagesRemaining = timerState.originalTotalPages - preservedPage;

                timerState.totalReadingTime = remainingReadingTime;
                timerState.totalPages = pagesRemaining;

                timerState.actualElapsedReadingTime = 0;
                timerState.currentPage = preservedPage;

                const progressBar = document.getElementById('progressBar');
                if (progressBar) {
                    progressBar.removeAttribute('data-initialized');
                }

                updateDisplay();
                saveState();

                closeAdjustTimeOverlay();
            }, 0);
        }

        function saveState() {
            localStorage.setItem('quranKhatmahState', JSON.stringify(timerState));
        }

        function loadState() {
            const saved = localStorage.getItem('quranKhatmahState');
            if (saved) {
                const loaded = JSON.parse(saved);
                if (loaded.inputMode) timerState.inputMode = loaded.inputMode;
                if (loaded.finishTime) timerState.finishTime = loaded.finishTime;

                // Only restore if timer was running
                if (loaded.isRunning) {
                    timerState = loaded;
                    timerState.lastTickTime = Date.now();
                    document.getElementById('totalPages').value = timerState.totalPages;
                } else if (loaded.timeline && loaded.timeline.length > 0) {
                    // Restore timeline setup but not running state
                    timerState.timeline = loaded.timeline;
                    timerState.totalPages = loaded.totalPages;
                    document.getElementById('totalPages').value = timerState.totalPages;
                }
            }
        }

        // Initialize on load
        init();

        // Save state on page unload
        window.addEventListener('beforeunload', saveState);
    </script>
</body>
